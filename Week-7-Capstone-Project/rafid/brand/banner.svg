<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" aria-label="Rafid - fix your CV, find your work">
  <!-- Discord application banner. 680x240 is the recommended size. -->
  <rect width="680" height="240" fill="#1F3864"/>

  <g stroke="#2B4B7D" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M0 40 C 120 40, 150 26, 680 26"/>
    <path d="M0 212 C 160 212, 200 226, 680 226"/>
  </g>

  <g transform="translate(56 22) scale(0.38)">
    <g fill="none" stroke="#F0B429" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
      <path d="M172 132 V 380"/>
      <path d="M172 132 H 258 A 70 70 0 0 1 258 272 H 172"/>
      <path d="M244 272 L 344 380"/>
    </g>
  </g>

  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="212" y="104" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="6">RAFID</text>
    <text x="214" y="148" font-size="34" font-weight="600" fill="#F0B429"
          font-family="'Segoe UI','Noto Naskh Arabic',Tahoma,'Arial Unicode MS',sans-serif">رافد</text>
    <text x="214" y="186" font-size="20" fill="#9DB3D4" letter-spacing="1.2">Fix your CV. Find your work.</text>
  </g>

  <line x1="470" y1="72" x2="470" y2="176" stroke="#2F5490" stroke-width="2"/>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#7E9AC8">
    <text x="496" y="94">CV review</text>
    <text x="496" y="128">rewrite</text>
    <text x="496" y="162">freelance matching</text>
  </g>
</svg>
